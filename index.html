//Createten cards using HTML and CSS, featuring an image at the top, along with a card
title and description. Align these cards horizontally on the page

<!DOCTYPE html>
<html>
<head>
<title>Ten Cards</title>
<style>
.container {
    display: flex;
    gap: 15px;
    overflow-x: auto;
}

.card {
    min-width: 180px;
    border: 1px solid gray;
    border-radius: 10px;
    text-align: center;
    padding-bottom: 10px;
}

.card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
}

.card h3 {
    color: blue;
}

</style>
</head>
<body>

<h2>My Cards</h2>

<div class="container" id="cards"></div>

<script>
let container = document.getElementById("cards");

for(let i = 1; i <= 10; i++) {

    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <img src="https://picsum.photos/200?random=${i}">
        <h3>Card ${i}</h3>
        <p>This is card description ${i}.</p>
    `;

    container.appendChild(card);
}
</script>

</body>
</html>
