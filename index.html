// Create a website where users can enter a country, and the platform will showcase a
list of universities, including their names, websites, and corresponding
states, all Data fetched through an API.


<!DOCTYPE html>
<html>
<head>
<title>University Finder</title>
</head>
<body>

<h2>University Finder</h2>

<input type="text" id="country"
placeholder="Enter Country Name">

<button onclick="searchUniversity()">Search</button>

<ul id="result"></ul>

<script>

async function searchUniversity() {

 let country =
 document.getElementById("country").value.trim();

 let result = document.getElementById("result");

 result.innerHTML = "Loading...";

 if(!country) {
  result.innerHTML = "Enter a country name";
  return;
 }

 try {

  let response = await fetch(
   "https://universities.hipolabs.com/search?country="
   + encodeURIComponent(country)
  );

  let data = await response.json();

  result.innerHTML = "";

  data.forEach(function(university) {

   let li = document.createElement("li");

   let link = document.createElement("a");

   link.href = university.web_pages[0] || "#";
   link.innerText = university.name;
   link.target = "_blank";

   li.appendChild(link);

   li.innerHTML +=
   "<br>State: " +
   (university["state-province"] || "Not Available");

   result.appendChild(li);

  });

  if(data.length === 0) {
   result.innerHTML = "No universities found.";
  }

 }
 catch(error) {
  result.innerHTML = "API Error";
 }

}

</script>
</body>
</html>
