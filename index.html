//●Generate a user interface for a chessboard using JavaScript,
dynamically creating all HTML elements and applying CSS properties through
JavaScript.


<!DOCTYPE html>
<html>
<head>
<title>Chess Board</title>
</head>

<body>

<h2>Chess Board</h2>

<div id="board"></div>

<script>

let board = document.getElementById("board");

board.style.display = "grid";
board.style.gridTemplateColumns = "repeat(8, 60px)";
board.style.width = "480px";

let pieces = [
"♜","♞","♝","♛","♚","♝","♞","♜",
"♟","♟","♟","♟","♟","♟","♟","♟",
"","","","","","","","",
"","","","","","","","",
"","","","","","","","",
"","","","","","","","",
"♙","♙","♙","♙","♙","♙","♙","♙",
"♖","♘","♗","♕","♔","♗","♘","♖"
];

for(let i = 0; i < 64; i++) {

    let cell = document.createElement("div");

    cell.style.width = "60px";
    cell.style.height = "60px";
    cell.style.fontSize = "35px";
    cell.style.textAlign = "center";

    cell.style.background =
    (Math.floor(i/8) + i%8) % 2 === 0
    ? "white" : "green";

    cell.innerText = pieces[i];

    board.appendChild(cell);
}

</script>
</body>
</html>
